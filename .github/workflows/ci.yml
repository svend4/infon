name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.21', '1.22']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      # -timeout 30m: the raytrace Monte-Carlo unbiasedness tests are slow under
      # -race and exceed go test's 10m default on CI runners.
      run: go test -v -race -timeout 30m -coverprofile=/tmp/coverage.out -covermode=atomic ./...
      if: matrix.os != 'windows-latest'

    - name: Run tests (Windows)
      run: go test -v -race -timeout 30m -coverprofile=${{runner.temp}}/coverage.out -covermode=atomic ./...
      if: matrix.os == 'windows-latest'

    - name: Build
      run: go build -v ./cmd/tvcp

    - name: Test binary
      run: ./tvcp version
      if: matrix.os != 'windows-latest'

    - name: Test binary (Windows)
      run: .\tvcp.exe version
      if: matrix.os == 'windows-latest'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.22'
      with:
        file: /tmp/coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    # golangci-lint v2 requires golangci-lint-action v7 (v4 cannot drive a v2
    # binary -> "exit code 3"). Pin the version so an unattended `latest` bump
    # can't change the rules out from under us again (see .golangci.yml).
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.5.0
