# golangci-lint configuration.
#
# Why this file exists: the CI workflow runs golangci-lint with `version: latest`
# and no config, so the v1->v2 "latest" upgrade silently enabled new diagnostics
# (the staticcheck QF* "quickfix" style hints) that were not enforced when Lint
# last passed. This config pins the project's intended lint behavior so it is
# deterministic and matches the standard the codebase was written to.
version: "2"

linters:
  # Keep golangci-lint's sensible default set (errcheck, govet, ineffassign,
  # staticcheck, unused). We only tune the noise below.
  settings:
    errcheck:
      # Best-effort calls whose error is conventionally ignored across the repo
      # (closing a response body / file, writing to an in-memory or log sink).
      # Excluding them avoids churning every `defer x.Close()` into a closure.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*os.File).WriteString
        - (*os.File).Sync
    staticcheck:
      # Replicate golangci-lint's default staticcheck exclusions (the ST* style
      # rules it disables out of the box) and additionally drop the opinionated
      # QF* "quickfix" hints (tagged-switch / lift-into-loop) — refactoring
      # suggestions, not bugs, and not part of the standard the code was written
      # under. Replacing `checks` would otherwise re-enable everything.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1003
        - -QF1006
